<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="text-center mb-4">Créer un compte</h4>

                    <input id="username" class="form-control mb-3" placeholder="Nom d'utilisateur">
                    <input id="email" type="email" class="form-control mb-3" placeholder="Email">
                    <input id="password" type="password" class="form-control mb-3" placeholder="Mot de passe">
                    <input id="whatsapp" class="form-control mb-3" placeholder="Numéro WhatsApp (+212...)">

                    <button class="btn btn-success w-100" onclick="register()">S'inscrire</button>

                    <p id="msg" class="text-center mt-3"></p>

                    <div class="text-center mt-3">
                        <a href="login.html">Déjà un compte ? Se connecter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="register.js"></script>
</body>
</html>
